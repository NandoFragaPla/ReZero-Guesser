<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Re:Zero - Guesser</title>
</head>
<body class="custom-body">
    <div class="lang-switch" role="group" aria-label="Idioma">
        <button type="button" class="lang-btn" data-lang="pt" aria-label="Português" title="Português">
            <svg viewBox="0 0 20 14" aria-hidden="true">
                <rect width="20" height="14" fill="#009B3A"/>
                <polygon points="10,1 18.6,7 10,13 1.4,7" fill="#FEDD00"/>
                <circle cx="10" cy="7" r="2.7" fill="#002776"/>
            </svg>
        </button>
        <button type="button" class="lang-btn" data-lang="en" aria-label="English" title="English">
            <svg viewBox="0 0 19 10" aria-hidden="true">
                <rect width="19" height="10" fill="#fff"/>
                <rect width="19" height="1" y="0" fill="#B22234"/>
                <rect width="19" height="1" y="2" fill="#B22234"/>
                <rect width="19" height="1" y="4" fill="#B22234"/>
                <rect width="19" height="1" y="6" fill="#B22234"/>
                <rect width="19" height="1" y="8" fill="#B22234"/>
                <rect width="8" height="5" fill="#3C3B6E"/>
            </svg>
        </button>
    </div>
    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-puck">
            <img src="img/puck-loading.png" alt="">
            <span>Loading</span>
        </div>
    </div>
    <div class="container mx-auto header-container">
        <img src="img/rezerodle_title.png" alt="Re:Zero Guesser">
    </div>

    <div class="container main-container">
        <div class="sub-container">
            <div class="game">
                <div class="fancy-background">
                    <span data-i18n="guessTitle">Adivinhe o personagem de Re:Zero de hoje!</span>
                    <div id="yesterday-row" class="yesterday-row" style="display: none;">
                        <span class="yesterday-label" data-i18n="yesterday">Personagem de ontem:</span>
                        <div class="yesterday-content">
                            <img id="yesterday-img" src="" alt="">
                            <span id="yesterday-name"></span>
                        </div>
                    </div>
                    <div id="yesterday-row" class="yesterday-row" style="display: none;">
                        <span class="yesterday-label" data-i18n="yesterday">Personagem de ontem:</span>
                        <div class="yesterday-content">
                            <img id="yesterday-img" src="" alt="">
                            <span id="yesterday-name"></span>
                        </div>
                    </div>
                    <div id="char-count" style="color: white; text-align: center; margin-top: 10px;"></div>
                </div>
            </div>

            <div class="hint-section mb-3">
                <button id="btn-hint" class="hint-button" data-i18n="revealHint" style="display: none;">Revelar Dica</button>
                <div id="hint-display" class="hint-text" style="display: none;"></div>
            </div>

            <div class="answers">
                <div class="guessbox">
                    <div class="content">
                        <div class="search">
                            <input type="text" placeholder="Carregando Wiki..." disabled>
                        </div>
                        <div class="options"></div>
                    </div>
                </div>

                <div class="guessed-answers">
                    <div class="guessed-answers-header">
                        <div class="square-container">
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colCharacter">Personagem</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colGender">Gênero</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colRace">Raça</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colHeight">Altura</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colStatus">Status</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colAge">Idade</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colAffiliation">Afiliação</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colAffinity">Afinidade</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colProtection">Proteção</div><hr></div>
                            <div class="square square-header-tile"><div class="square-content" data-i18n="colAuthority">Autoridade</div><hr></div>
                        </div>
                    </div>
                    <div class="user-answer"></div>
                </div>
            </div>

            <div id="win-popup" class="win-screen-overlay" style="display: none;">
                <div class="win-background">
                    <div class="win-answer">
                        <img id="win-char-img" src="" alt="Personagem">
                        <div class="win-info">
                            <span class="win-answer-text" data-i18n="youGuessed">Você adivinhou</span>
                            <h2 id="win-char-name" class="win-answer-name">Personagem</h2>
                        </div>
                    </div>
                    <p class="nb-trys">Você levou <span id="try-count">0</span> tentativas</p>
                    <div class="timer-info">
                        <div class="timer-title" data-i18n="nextCharacter">Próximo personagem em</div>
                        <div class="countdown">
                            <ul>
                                <li><span id="hours">00</span></li>
                                <li class="separator">:</li>
                                <li><span id="minutes">00</span></li>
                                <li class="separator">:</li>
                                <li><span id="seconds">00</span></li>
                            </ul>
                        </div>
                    </div>
                    <button id="btn-close" class="hint-button mt-3" data-i18n="close" onclick="document.getElementById('win-popup').style.display='none'">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <a class="x-link" href="https://x.com/Barusu_Br" target="_blank" rel="noopener noreferrer" aria-label="Perfil no X">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
        </a>
        <span class="site-version">V 1.1</span>
    </footer>

    <script src="javascript/character_data.js"></script>
    <script type="module" src="javascript/options_logic.js"></script>
</body>
</html>
